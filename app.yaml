kind: wasmer.io/App.v0
name: sistema-instituto
owner: tu-namespace
package: .

capabilities:
  database:
    engine: postgres

locality:
  regions:
    - fr-roub1

scaling:
  mode: single_concurrency

env:
  APP_DATABASE_ENGINE: postgresql
  COOKIE_SECURE: "true"
  FLASK_DEBUG: "false"
  FLASK_INSTANCE_PATH: "/tmp/instance"

health_checks:
  - http:
      method: get
      path: /login
      interval: 30s
      timeout: 10s
      unhealthy_threshold: 2
      healthy_threshold: 1
      expected_status_codes:
        - 200
