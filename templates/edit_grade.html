{% extends "layout.html" %}
{% block title %}Editar nota{% endblock %}
{% block content %}
  <section class="page-heading"><div><p class="eyebrow">Solo administrador</p><h1>Editar nota</h1>
    <p class="muted">Alumno: {{ grade['student_name'] }}</p></div></section>
  <section class="card form-card">
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Materia
        <select name="subject_id" required>
          {% for subject in subjects %}
            <option value="{{ subject['id'] }}" {{ 'selected' if subject['id'] == grade['subject_id'] else '' }}>{{ subject['name'] }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Corte evaluativo
        <select name="term" required>
          {% for period in periods %}
            <option value="{{ period }}" {{ 'selected' if grade['term'] == period else '' }}>{{ period }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Nota (número de 0 a 100 o texto de hasta 3 caracteres)<input name="score" type="text" maxlength="6" value="{{ grade['score'] }}" required></label>
      <div class="form-actions"><a class="button button-secondary" href="{{ url_for('grade_list') }}">Cancelar</a><button class="button button-primary" type="submit">Guardar cambios</button></div>
    </form>
  </section>
{% endblock %}
