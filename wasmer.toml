[package]
name = "tu-namespace/sistema-instituto"
version = "0.1.0"
description = "Sistema de notas para instituto"

[dependencies]
"python/python" = "^0.2.0"

[fs]
"/src/app.py" = "./app.py"
"/src/templates" = "./templates"
"/src/static" = "./static"
"/cpython/lib/python3.12" = "./.wasmer/site-packages"

[[command]]
name = "web"
module = "python/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "-m",
    "flask",
    "--app",
    "/src/app",
    "run",
    "--host=0.0.0.0",
    "--port=8080",
    "--no-debugger",
    "--no-reload",
]
env = [
    "PYTHONEXECUTABLE: /bin/python",
    "PYTHONPATH: /src:/cpython/lib/python3.12",
]
